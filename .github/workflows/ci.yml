name: Validation du dépôt
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  repository-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Vérifier les fichiers de livraison présents
        run: |
          test -s README.md
          test -s docs/DECISION-HEBERGEMENT.md
          test -s docs/ROADMAP-16-ETAPES.md
          test -s .env.example
          ! test -e .env
          ! test -d node_modules
